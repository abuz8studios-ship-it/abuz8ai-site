<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000308;color:#e8e6e0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh;width:100vw}
  a{color:inherit;text-decoration:none}
  button{background:transparent;border:0;color:inherit;font:inherit;cursor:pointer}
  input[type=range]{-webkit-appearance:none;height:2px;background:rgba(200,165,92,.3);border-radius:2px;outline:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#c8a55c;border-radius:50%;cursor:pointer;box-shadow:0 0 10px rgba(200,165,92,.6)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;background:#c8a55c;border-radius:50%;cursor:pointer;border:0}
  .mono{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:#8a8577}

  #webgl{position:fixed;inset:0;z-index:1;cursor:grab}
  #webgl.dragging{cursor:grabbing}

  /* ── NAV ── */

  nav.top .brand{font-family:'Fraunces',serif;font-size:1.15rem;color:#f4f2ec}
  nav.top .brand em{font-style:italic;color:#c8a55c}
  nav.top ul{display:flex;gap:26px;list-style:none;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase}
  nav.top ul a{color:#a8a495;transition:.2s}

  @media (max-width:780px){nav.top ul{display:none}nav.top{padding:14px 20px}}

  /* ── LOADER ── */

  #loader .prog span{display:block;height:100%;background:#c8a55c;width:0;transition:width .3s ease;box-shadow:0 0 10px #c8a55c}

  /* ── HUD ── */
  #hud{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity 1s ease .3s}
  #hud.on{opacity:1}

  .card{position:fixed;background:rgba(10,15,25,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(200,165,92,.18);border-radius:14px;padding:16px 18px;pointer-events:auto;font-family:'JetBrains Mono',monospace;color:#c8c4b5}

  /* clock, top-left */

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const canvas = document.getElementById('webgl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000308);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 0, 3.2);

// ── STARFIELD (deep space)
const sg = new THREE.BufferGeometry();
const N_STARS = 3500; const pos = new Float32Array(N_STARS*3), sz = new Float32Array(N_STARS);
for (let i=0;i<N_STARS;i++){
  const r = 40 + Math.random()*140;
  const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
  pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
  pos[i*3+1] = r*Math.sin(ph)*Math.sin(th);
  pos[i*3+2] = r*Math.cos(ph);
  sz[i] = Math.random()*1.8 + 0.3;
}
sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
sg.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));
const stars = new THREE.Points(sg, new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uPix:{value:renderer.getPixelRatio()} },
  vertexShader:`attribute float aSize; uniform float uPix; varying float vA;
    void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); gl_Position = projectionMatrix*mv;
    gl_PointSize = aSize*uPix*(50.0/-mv.z); vA = aSize; }`,
  fragmentShader:`varying float vA; void main(){
    vec2 uv = gl_PointCoord-.5; float d = length(uv);
    float a = smoothstep(.5,.0,d); gl_FragColor = vec4(vec3(1.), a*.55*vA); }`
}));
scene.add(stars);

// ── SUN + LIGHTS
const sunLight = new THREE.DirectionalLight(0xffffff, 3.5);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x1e2635, 0.15));

// ── TEXTURE LOADER (from three.js public examples — NASA Blue Marble)
const TB = 'https://unpkg.com/three@0.161.0/examples/textures/planets/';
const TEX_URLS = [
  ['day',      TB+'earth_atmos_2048.jpg'],
  ['normal',   TB+'earth_normal_2048.jpg'],
  ['specular', TB+'earth_specular_2048.jpg'],
  ['clouds',   TB+'earth_clouds_1024.png'],
  ['nights',   TB+'earth_lights_2048.png'],
];
const loader = new THREE.TextureLoader();
const manager = new THREE.LoadingManager();
manager.onProgress = (url,l,t)=>{ document.getElementById('loader-bar').style.width = (l/t*100)+'%'; };
loader.manager = manager;

const bar = document.getElementById('loader-bar');
const lblEl = document.getElementById('loader-lbl');
const T = {};
let loaded = 0;
function loadOne(name, url){
  return new Promise(res => {
    loader.load(url, t => { T[name]=t; loaded++; bar.style.width = (loaded/TEX_URLS.length*100)+'%';
      lblEl.textContent = 'Loaded '+name+'…'; res(); },
      undefined,
      err => { console.warn('failed:',name,err); loaded++; bar.style.width=(loaded/TEX_URLS.length*100)+'%'; res(); });
  });
}

async function init(){
  await Promise.all(TEX_URLS.map(([n,u]) => loadOne(n,u)));
  document.getElementById('tex-count').textContent = loaded+'/'+TEX_URLS.length;
  buildEarth();
  setTimeout(()=>{
    document.getElementById('loader').classList.add('gone');
    document.getElementById('hud').classList.add('on');
  }, 250);
}

let earth, clouds, atmo, marker;

function buildEarth(){
  // EARTH SPHERE with custom day/night shader
  const geom = new THREE.SphereGeometry(1, 128, 128);
  const mat = new THREE.ShaderMaterial({
    uniforms:{
      dayMap:   {value: T.day || null},
      nightMap: {value: T.nights || null},
      normalMap:{value: T.normal || null},
      specMap:  {value: T.specular || null},
      sunDir:   {value: new THREE.Vector3(1,0,0)},
      uLights:  {value: 1.0},
    },
    vertexShader:/*glsl*/`
      varying vec2 vUv; varying vec3 vNormal; varying vec3 vWorldNormal;
      void main(){
        vUv = uv;
        vNormal = normalize(normalMatrix * normal);
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.);
      }
    `,
    fragmentShader:/*glsl*/`
      uniform sampler2D dayMap, nightMap, normalMap, specMap;
      uniform vec3 sunDir; uniform float uLights;
      varying vec2 vUv; varying vec3 vNormal; varying vec3 vWorldNormal;
      void main(){
        vec3 day   = texture2D(dayMap,   vUv).rgb;
        vec3 night = texture2D(nightMap, vUv).rgb;
        float cosLat = clamp(dot(normalize(vWorldNormal), normalize(sunDir)), -1.0, 1.0);
        // Smooth terminator
        float dayMix = smoothstep(-0.12, 0.18, cosLat);
        // City-lights emissive on the night side
        vec3 lit = night * uLights * pow(1.0 - dayMix, 1.6) * 1.4;
        vec3 col = mix(vec3(0.0), day * (0.15 + dayMix*1.25), 1.0);
        col += lit;
        // Specular ocean highlight
        float spec = texture2D(specMap, vUv).r; // white where ocean
        vec3 viewDir = vec3(0,0,1);
        vec3 reflectDir = reflect(-normalize(sunDir), normalize(vWorldNormal));
        float shine = pow(max(dot(reflectDir, viewDir), 0.0), 30.0);
        col += vec3(1.0, 0.95, 0.85) * shine * spec * 0.8 * max(dayMix, 0.0);
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  earth = new THREE.Mesh(geom, mat);
  scene.add(earth);

  // CLOUDS layer
  const cloudsGeo = new THREE.SphereGeometry(1.01, 96, 96);
  const cloudsMat = new THREE.MeshLambertMaterial({ map:T.clouds, transparent:true, opacity:0.65, depthWrite:false });
  clouds = new THREE.Mesh(cloudsGeo, cloudsMat);
  scene.add(clouds);

  // ATMOSPHERE glow
  const atmoGeo = new THREE.SphereGeometry(1.08, 96, 96);
  const atmoMat = new THREE.ShaderMaterial({
    side:THREE.BackSide, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ sunDir:{value:new THREE.Vector3(1,0,0)} },
    vertexShader:`varying vec3 vN; varying vec3 vW;
      void main(){ vN = normalize(normalMatrix*normal); vW = normalize(mat3(modelMatrix)*normal);
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:`uniform vec3 sunDir; varying vec3 vN; varying vec3 vW;
      void main(){
        float rim = pow(1.0 - abs(dot(vN, vec3(0,0,1))), 3.2);
        float lit = clamp(dot(normalize(vW), normalize(sunDir))*0.5 + 0.5, 0.0, 1.0);
        vec3 c = mix(vec3(0.15,0.28,0.55), vec3(0.55,0.82,1.0), lit);
        gl_FragColor = vec4(c, rim * (0.5 + lit*0.5));
      }`
  });
  atmo = new THREE.Mesh(atmoGeo, atmoMat);
  scene.add(atmo);

  // ABUZ8 HQ marker — Dayton, Ohio (39.7589 N, 84.1916 W)
  marker = makeMarker(39.7589, -84.1916, 0xc8a55c);
  scene.add(marker);
}

function latLngToVec3(lat, lng, r=1.02){
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lng + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}
function makeMarker(lat, lng, color){
  const g = new THREE.Group();
  const pos = latLngToVec3(lat, lng);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.008, 16, 16), new THREE.MeshBasicMaterial({color}));
  dot.position.copy(pos);
  g.add(dot);
  // ring
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.014, 0.020, 32), new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.85, side:THREE.DoubleSide}));
  ring.position.copy(pos); ring.lookAt(0,0,0); ring.rotateX(Math.PI);
  g.add(ring);
  // pulse ring
  const pulse = new THREE.Mesh(new THREE.RingGeometry(0.02, 0.025, 32), new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.5, side:THREE.DoubleSide}));
  pulse.position.copy(pos); pulse.lookAt(0,0,0); pulse.rotateX(Math.PI);
  g.userData.pulse = pulse; g.add(pulse);
  return g;
}

// ─── SUN POSITION — day of year + hour of day
let sunAzimuth = 0;   // radians (0 = midnight anti-sun, PI = noon on greenwich)
let sunAltitude = 0;  // radians (equator tilt: -23.44 .. +23.44)
let liveTime = true;

function updateSun(){
  const now = liveTime ? new Date() : new Date(Date.UTC(2026,0,1, Math.floor(hourOverride), (hourOverride%1)*60|0));
  const utcHours = now.getUTCHours() + now.getUTCMinutes()/60 + now.getUTCSeconds()/3600;
  // Solar noon at longitude = 180 - (utcHours * 15). Sub-solar longitude:
  const subLng = -(utcHours - 12) * 15;
  // approximate solar declination (23.44° * sin(dayOfYear))
  const start = Date.UTC(now.getUTCFullYear(),0,0);
  const doy = (now - start) / 86400000;
  const decl = 23.44 * Math.sin(2*Math.PI*(doy - 81)/365.25);
  const v = latLngToVec3(decl, subLng, 100);
  sunLight.position.copy(v);
  const dir = v.clone().normalize();
  if (earth) earth.material.uniforms.sunDir.value.copy(dir);
  if (atmo)  atmo.material.uniforms.sunDir.value.copy(dir);

  // HUD
  document.getElementById('sub-solar').innerHTML =
    Math.abs(decl).toFixed(1)+'° '+(decl>=0?'N':'S')+' / '+Math.abs(subLng).toFixed(1)+'° '+(subLng>=0?'E':'W');
  const monthName = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][now.getUTCMonth()];
  document.getElementById('date').textContent = now.getUTCDate()+' '+monthName+' '+now.getUTCFullYear()+' UTC';
  document.getElementById('utc').textContent  = now.toISOString().slice(11,19);
  // season (Northern hemisphere)
  const seasonN = decl > 15 ? 'Summer (N)' : decl < -15 ? 'Winter (N)' : (doy < 172 ? 'Spring (N)' : 'Autumn (N)');
  document.getElementById('season').textContent = seasonN;
}
let hourOverride = 12;

// ─── INTERACTION: drag rotate, wheel zoom, touch
let rotX=0, rotY=0, targetRotX=0, targetRotY=0, dragging=false, lastX=0, lastY=0;
let camDist = 3.2, targetDist = 3.2;
let autoSpin = false;

canvas.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; canvas.classList.add('dragging'); });
addEventListener('pointerup',   ()=>{ dragging=false; canvas.classList.remove('dragging'); });
addEventListener('pointercancel',()=>{ dragging=false; canvas.classList.remove('dragging'); });
addEventListener('pointermove', e=>{
  if (dragging){
    targetRotY += (e.clientX - lastX)*0.005;
    targetRotX += (e.clientY - lastY)*0.005;
    targetRotX = Math.max(-1.3, Math.min(1.3, targetRotX));
    lastX=e.clientX; lastY=e.clientY;
  }
  // cursor coords (raycast to earth)
  if (!earth) return;
  const raycaster = new THREE.Raycaster();
  const m = new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(m, camera);
  const hits = raycaster.intersectObject(earth);
  const $lat = document.getElementById('cur-lat');
  const $lng = document.getElementById('cur-lng');
  const $reg = document.getElementById('cur-region');
  if (hits.length){
    // world-space hit → back-transform through earth's rotation
    const p = hits[0].point.clone();
    const inv = new THREE.Matrix4().copy(earth.matrixWorld).invert();
    p.applyMatrix4(inv).normalize();
    const lat = 90 - Math.acos(p.y) * 180/Math.PI;
    const lng = ((Math.atan2(p.z, -p.x) * 180/Math.PI) + 360) % 360 - 180;
    $lat.textContent = Math.abs(lat).toFixed(2)+'° '+(lat>=0?'N':'S');
    $lng.textContent = Math.abs(lng).toFixed(2)+'° '+(lng>=0?'E':'W');
    $reg.textContent = coarseRegion(lat, lng);
  } else {
    $lat.textContent = '·'; $lng.textContent = '·'; $reg.textContent = 'space';
  }
});
function coarseRegion(lat,lng){
  if (Math.abs(lat) < 23.44) {
    if (lng>-30 && lng<50) return 'Tropical Africa';
    if (lng>=50 && lng<150) return 'Tropical Asia';
    if (lng>=150 || lng<-140) return 'Pacific';
    return 'Tropical Americas';
  }
  if (lat > 60) return 'Arctic';
  if (lat < -60) return 'Antarctic';
  if (lat>0) return lng<-30?'North America':(lng<60?'Europe':'North Asia');
  return lng<-30?'South America':(lng<130?'Africa/Aus':'South Pacific');
}
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  targetDist *= (1 + Math.sign(e.deltaY)*0.08);
  targetDist = Math.max(1.4, Math.min(8, targetDist));
}, {passive:false});

// keyboard
addEventListener('keydown', e=>{
  if (e.key === 'n' || e.key === 'N') { hourOverride = 0;  liveTime=false; document.getElementById('time-slider').value=0;  document.getElementById('time-val').textContent='0h'; document.getElementById('time-real').classList.remove('active'); updateSun(); }
  if (e.key === 'd' || e.key === 'D') { hourOverride = 12; liveTime=false; document.getElementById('time-slider').value=12; document.getElementById('time-val').textContent='12h';document.getElementById('time-real').classList.remove('active'); updateSun(); }
  if (e.key === 'r' || e.key === 'R') { reset(); }
});
function reset(){ targetRotX=0; targetRotY=0; targetDist=3.2; liveTime=true; document.getElementById('time-real').classList.add('active'); }

// controls
document.getElementById('time-slider').oninput = e=>{
  hourOverride = parseFloat(e.target.value);
  document.getElementById('time-val').textContent = hourOverride.toFixed(1).replace('.0','')+'h';
  liveTime = false;
  document.getElementById('time-real').classList.remove('active');
};
document.getElementById('time-real').onclick = ()=>{
  liveTime = true;
  document.getElementById('time-real').classList.add('active');
};
document.getElementById('btn-clouds').onclick = e=>{
  if (!clouds) return;
  clouds.visible = !clouds.visible;
  e.target.classList.toggle('active', clouds.visible);
  document.getElementById('cur-clouds').textContent = clouds.visible?'on':'off';
};
document.getElementById('btn-atmo').onclick = e=>{
  if (!atmo) return;
  atmo.visible = !atmo.visible;
  e.target.classList.toggle('active', atmo.visible);
};
document.getElementById('btn-lights').onclick = e=>{
  if (!earth) return;
  const on = earth.material.uniforms.uLights.value > 0.5;
  earth.material.uniforms.uLights.value = on ? 0 : 1;
  e.target.classList.toggle('active', !on);
};
document.getElementById('btn-spin').onclick = e=>{
  autoSpin = !autoSpin;
  e.target.classList.toggle('active', autoSpin);
};
document.getElementById('btn-reset').onclick = reset;

// resize
addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
});

// POST
const composer = new EffectComposer(renderer);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.55, 0.55, 0.2));

// LOOP
const clock = new THREE.Clock();
let frames = 0, fpsT = 0;
function tick(){
  const dt = clock.getDelta(), t = clock.elapsedTime;
  // smooth interp
  rotX += (targetRotX - rotX)*0.12;
  rotY += (targetRotY - rotY)*0.12;
  camDist += (targetDist - camDist)*0.12;

  if (autoSpin) targetRotY += 0.15*dt;
  if (earth){ earth.rotation.set(rotX, rotY, 0); }
  if (clouds){ clouds.rotation.set(rotX, rotY + t*0.008, 0); }
  if (atmo){ atmo.rotation.set(rotX, rotY, 0); }
  if (marker){
    marker.rotation.set(rotX, rotY, 0);
    if (marker.userData.pulse){
      const p = marker.userData.pulse;
      const s = 1 + Math.sin(t*2)*0.4 + 0.4;
      p.scale.set(s,s,1);
      p.material.opacity = Math.max(0, 0.5 - (s-1)*0.35);
    }
  }
  camera.position.z = camDist;
  camera.lookAt(0,0,0);

  updateSun();

  // fps
  frames++; fpsT += dt;
  if (fpsT > 0.5){ document.getElementById('fps').textContent = Math.round(frames/fpsT); frames=0; fpsT=0; }

  composer.render();
  requestAnimationFrame(tick);
}
init().then(()=>{ tick(); });
</script>
