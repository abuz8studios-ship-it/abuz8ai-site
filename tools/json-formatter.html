<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="/assets/css/abuz8-mach3.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter & Beautifier — ABUZ8</title>
<meta name="description" content="Free online JSON formatter and beautifier. Clean, format, and validate your JSON data instantly. Part of the ABUZ8 AI tool ecosystem.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --lapis: #0a1628;
  --lapis-mid: #0f2040;
  --gold: #c9a84c;
  --gold-light: #e8d48b;
  --turq: #0e9f6e;
  --text: #e8e4d8;
  --dim: #8a9aaa;
  --border: #1a2e50;
  --card: #0d1a30;
  --cream: #f5f0e8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--lapis);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; flex: 1; }
h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--cream); margin-bottom: 10px; }
.sub { color: var(--dim); margin-bottom: 30px; font-weight: 300; }

.tool-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 30px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
textarea {
  width: 100%;
  height: 300px;
  background: var(--lapis-mid);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  padding: 15px;
  margin-bottom: 20px;
  resize: vertical;
  font-size: 14px;
}
textarea:focus { border-color: var(--gold); outline: none; }

.actions { display: flex; gap: 10px; margin-bottom: 20px; }
.btn {
  padding: 12px 24px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  font-size: 14px;
}
.btn-gold { background: var(--gold); color: var(--lapis); }
.btn-gold:hover { background: var(--gold-light); transform: translateY(-1px); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--dim); }
.btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

.waiting-list {
  margin-top: 40px;
  padding: 30px;
  background: rgba(201, 168, 76, 0.05);
  border: 1px solid rgba(201, 168, 76, 0.2);
  border-radius: 12px;
  text-align: center;
}
.waiting-list h3 { color: var(--gold); margin-bottom: 10px; }
.waiting-list p { font-size: 14px; color: var(--dim); margin-bottom: 20px; }
.wl-form { display: flex; gap: 10px; max-width: 500px; margin: 0 auto; }
.wl-form input {
  flex: 1;
  background: var(--lapis);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 10px 15px;
}
.wl-form input:focus { border-color: var(--turq); outline: none; }

footer { padding: 40px; text-align: center; border-top: 1px solid var(--border); font-size: 12px; color: var(--dim); }

#error-msg { color: #ef4444; font-size: 13px; margin-top: 10px; }
</style>
<script src="_abuz8-live-brain.js" defer></script>

<script src="_abuz8-config.js" defer></script>
<link rel="canonical" href="https://abuz8ai.com/tools/json-formatter">
</head>
<body>

<div class="container">
  <header>
    <h1>JSON Formatter</h1>
    <p class="sub">Part of ABUZ8 — Free, client-side, secure.</p>
  </header>

  <div class="tool-card">
    <textarea id="json-input" placeholder="Paste your messy JSON here..."></textarea>
    <div class="actions">
      <button class="btn btn-gold" onclick="formatJson()">Format JSON</button>
      <button class="btn btn-ghost" onclick="minifyJson()">Minify</button>
      <button class="btn btn-ghost" onclick="copyToClipboard()">Copy</button>
      <button class="btn btn-ghost" onclick="clearInput()">Clear</button>
    </div>
    <div id="error-msg"></div>
  </div>

  <div class="waiting-list">
    <h3>Unlock Premium Agent Features</h3>
    <p>Join the waiting list for QADIR OS — our sovereign agentic operating system that builds and runs these tools for you automatically.</p>
    <form class="wl-form" onsubmit="submitWaitingList(event)">
      <input type="email" id="wl-email" placeholder="Enter your email" required>
      <button type="submit" class="btn btn-gold">Join Early Access</button>
    </form>
    <div id="wl-status" style="margin-top: 15px; font-size: 13px;"></div>
  </div>
</div>

<footer>
  &copy; 2026 ABUZ8 LLC. Built with sovereign AI.
</footer>

<script>
function formatJson() {
  const input = document.getElementById('json-input');
  const error = document.getElementById('error-msg');
  error.textContent = '';
  try {
    const parsed = JSON.parse(input.value);
    input.value = JSON.stringify(parsed, null, 2);
  } catch (e) {
    error.textContent = 'Invalid JSON: ' + e.message;
  }
}

function minifyJson() {
  const input = document.getElementById('json-input');
  const error = document.getElementById('error-msg');
  error.textContent = '';
  try {
    const parsed = JSON.parse(input.value);
    input.value = JSON.stringify(parsed);
  } catch (e) {
    error.textContent = 'Invalid JSON: ' + e.message;
  }
}

function copyToClipboard() {
  const input = document.getElementById('json-input');
  input.select();
  document.execCommand('copy');
  alert('Copied to clipboard!');
}

function clearInput() {
  document.getElementById('json-input').value = '';
  document.getElementById('error-msg').textContent = '';
}

async function submitWaitingList(e) {
  e.preventDefault();
  const email = document.getElementById('wl-email').value;
  const status = document.getElementById('wl-status');
  status.textContent = 'Sending...';
  status.style.color = 'var(--dim)';

  try {
    const response = await fetch('/api/waitlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: email,
        product_id: 'json-formatter',
        source: 'tools'
      })
    });

    const data = await response.json();
    if (data.success) {
      status.textContent = 'Success! You are on the list.';
      status.style.color = 'var(--turq)';
      document.getElementById('wl-email').value = '';
    } else {
      status.textContent = 'Error: ' + data.error;
      status.style.color = '#ef4444';
    }
  } catch (err) {
    status.textContent = 'Connection error. Please try again.';
    status.style.color = '#ef4444';
  }
}
</script>


<link rel="stylesheet" href="/assets/css/zait-chat.css">
<script src="/assets/js/zait-chat.js"></script>

<script src="/assets/js/dfy-banner.js" async></script>

<script src="/tools/_tools-shared.js" defer></script>
  <script src="/assets/js/abuz8-measure.js" defer></script>
</body>
</html>
