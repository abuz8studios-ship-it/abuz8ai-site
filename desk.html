<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desk — ABUZ8 Life Hub</title>
<meta name="description" content="Your ABUZ8 life system: connections, boards, agents. Login required.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://abuz8ai.com/desk">
<meta name="theme-color" content="#0a1628">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/abuz8-theme.css">
<style>
  #olive-grove { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  body.page-olive .glow-orb { display: none; }
  .desk { position: relative; z-index: 1; max-width: 1100px; margin: 40px auto 88px; padding: 0 24px; }
  .desk h1 { font-family: var(--font-display); font-size: clamp(1.8rem,4vw,2.4rem); margin: 8px 0 8px; }
  .who { color: var(--dim); margin-bottom: 28px; }
  .grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 20px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--glass); border: 1px solid var(--border-gold); border-radius: var(--r-lg); padding: 22px; }
  .panel h2 { font-size: 15px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; }
  .conn { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .conn button { background: none; border: 0; color: var(--gold); cursor: pointer; font-size: 12px; }
  form.add { display: grid; grid-template-columns: 120px 1fr auto; gap: 8px; margin-top: 14px; }
  form.add input, form.add select { background: rgba(10,22,40,.6); border: 1px solid var(--border-gold); color: var(--cream); padding: 8px 10px; border-radius: 6px; font-family: var(--font-body); }
  #chat-log { min-height: 160px; max-height: 280px; overflow: auto; font-size: 14px; color: var(--cream); line-height: 1.6; margin-bottom: 10px; }
  #chat-log p { margin: 0 0 8px; }
  #chat-log .you { color: var(--gold-light); }
  form.chat { display: flex; gap: 8px; }
  form.chat input { flex: 1; background: rgba(10,22,40,.6); border: 1px solid var(--border-gold); color: var(--cream); padding: 10px 12px; border-radius: 8px; }
  .msg { font-size: 13px; color: var(--dim); min-height: 18px; margin-top: 8px; }
  .msg.err { color: var(--gold-light); }
</style>
</head>
<body class="page-olive">
<div class="geo-bg"></div>
<div id="olive-grove" aria-hidden="true"></div>
<nav class="abuz8-nav">
<div class="nav-inner">
  <a href="/" style="text-decoration:none;">
    <div class="logo">ABUZ8</div>
    <div class="logo-sub">Life Hub</div>
  </a>
  <div class="nav-links">
    <a href="/">Boards</a>
    <a href="/tools.html">Tools</a>
    <button class="nav-cta" id="out" type="button">Log out</button>
  </div>
</div>
</nav>
<main class="desk">
  <div class="eyebrow" id="plan-chip">Loading…</div>
  <h1>Your <span class="gold">life system.</span></h1>
  <p class="who" id="who">Checking login…</p>
  <div class="grid">
    <section class="panel">
      <h2>Connections</h2>
      <div id="conns"></div>
      <form class="add" id="add">
        <select name="kind" aria-label="Kind">
          <option value="ai">AI sub</option>
          <option value="calendar">Calendar</option>
          <option value="contacts">Contacts</option>
          <option value="social">Social</option>
          <option value="money">Money</option>
          <option value="app">App</option>
          <option value="game">Game</option>
          <option value="site">Site</option>
          <option value="system">System</option>
        </select>
        <input name="label" required maxlength="120" placeholder="e.g. ChatGPT Plus, Google Calendar">
        <button class="btn btn-gold" type="submit">Add</button>
      </form>
      <div class="msg" id="cmsg"></div>
    </section>
    <section class="panel">
      <h2>Agent</h2>
      <div id="chat-log"></div>
      <form class="chat" id="chat">
        <input name="q" maxlength="4000" placeholder="Ask your desk…" autocomplete="off">
        <button class="btn btn-gold" type="submit">Send</button>
      </form>
      <div class="msg" id="amsg"></div>
      <p style="margin-top:16px;font-size:13px;color:var(--dim)">Free: 5 messages/day. Hub: your quota, your connections, boards cached overnight.</p>
      <button class="btn btn-outline" id="sub" type="button" style="margin-top:12px">Subscribe to Hub — $9/mo</button>
    </section>
  </div>
</main>
<script>
const who = document.getElementById("who");
const chip = document.getElementById("plan-chip");
const conns = document.getElementById("conns");
const cmsg = document.getElementById("cmsg");
const amsg = document.getElementById("amsg");
const log = document.getElementById("chat-log");
let state = null;

function line(html) { log.insertAdjacentHTML("beforeend", html); log.scrollTop = log.scrollHeight; }

async function load() {
  const r = await fetch("/api/desk", { credentials: "same-origin" });
  if (r.status === 401) { location.href = "/login.html"; return; }
  state = await r.json();
  if (!state.ok) { who.textContent = state.error || "Desk unreachable."; return; }
  who.textContent = state.email;
  chip.textContent = state.status === "active" ? ("Hub · " + (state.plan || "hub")) : "Free desk · 5 msgs/day";
  conns.innerHTML = (state.connections || []).length
    ? state.connections.map(c => `<div class="conn"><span><strong>${esc(c.kind)}</strong> · ${esc(c.label)}</span><button data-id="${c.id}" type="button">Remove</button></div>`).join("")
    : "<p style='color:var(--dim);font-size:14px'>Nothing connected yet. Add the AIs and systems you already pay for.</p>";
}

function esc(s) { return String(s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

document.getElementById("add").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  cmsg.textContent = "Saving…";
  const r = await fetch("/api/desk", {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kind: fd.get("kind"), label: fd.get("label") })
  });
  const d = await r.json();
  cmsg.textContent = d.ok ? "" : (d.error || "Failed");
  if (d.ok) { e.target.reset(); load(); }
});

conns.addEventListener("click", async (e) => {
  const id = e.target.getAttribute("data-id");
  if (!id) return;
  await fetch("/api/desk", {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id, remove: true })
  });
  load();
});

document.getElementById("chat").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = e.target.q.value.trim();
  if (!q) return;
  e.target.q.value = "";
  line(`<p class="you">You — ${esc(q)}</p>`);
  amsg.textContent = "";
  try {
    const r = await fetch("/api/agent", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: [{ role: "user", content: q }] })
    });
    const d = await r.json();
    const text = d.choices?.[0]?.message?.content || d.error || d.reply || "No reply.";
    line(`<p>Desk — ${esc(text)}</p>`);
    if (r.status === 429) amsg.textContent = "Free quota done. Subscribe to Hub.";
  } catch (_) {
    amsg.textContent = "Agent offline.";
  }
});

document.getElementById("sub").addEventListener("click", async () => {
  amsg.textContent = "Opening Stripe…";
  try {
    const r = await fetch("/api/stripe-checkout", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tool: "life-hub" })
    });
    const d = await r.json();
    if (d.url) location.href = d.url;
    else amsg.textContent = d.error || "Checkout not configured yet.";
  } catch (_) { amsg.textContent = "Checkout failed."; }
});

document.getElementById("out").addEventListener("click", async () => {
  await fetch("/api/auth", {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ logout: 1 })
  });
  location.href = "/";
});

load();
</script>
<script src="/assets/js/abuz8-ui.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<script src="/assets/js/abuz8-olive-grove.js" defer></script>
<script src="/assets/js/abuz8-atmosphere.js" defer></script>
</body>
</html>
